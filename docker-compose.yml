version: "3.9"

services:
  backend:
    build:
      context: .                   
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data           
    ports:
      - "5000:5000"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile       
    ports:
      - "8080:80"
    depends_on:
      - backend
